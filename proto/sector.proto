// The wire form of everything a frigate and the sector server say to each other.
// Ore is counted in whole grams, so what the rock, every hold and every warehouse carry always adds up exactly.
// A client never says where it is: it sends the helm's orders, numbered, and the server flies the ship.
// The rules (how a frigate flies, who may mine or dock, how ore moves) live in src/shared and server/world.ts; this file is only the shape.
syntax = "proto3";

package sector;

enum Refusal {
  REFUSAL_UNSPECIFIED = 0;
  REFUSAL_NONE = 1;
  REFUSAL_NOT_MINING = 2;
  REFUSAL_OUT_OF_RANGE = 3;
  REFUSAL_ROCK_EXHAUSTED = 4;
  REFUSAL_HOLD_FULL = 5;
}

enum DockRefusal {
  DOCK_REFUSAL_UNSPECIFIED = 0;
  DOCK_REFUSAL_NONE = 1;
  DOCK_REFUSAL_TOO_FAR = 2;
  DOCK_REFUSAL_TOO_FAST = 3;
  DOCK_REFUSAL_NO_BERTH_FREE = 4;
  reserved 5;
  // The station has her in hand and will not be interrupted.
  DOCK_REFUSAL_MANEUVERING = 6;
  DOCK_REFUSAL_NOT_SAVED = 7;
}

// Where a ship stands with the station.
enum Mooring {
  MOORING_UNSPECIFIED = 0;
  MOORING_NONE = 1;
  // A berth is kept for her; she is still her pilot's to fly.
  MOORING_ASSIGNED = 2;
  // The station is bringing her in: her helm does nothing.
  MOORING_DOCKING = 3;
  // She lies in her berth, and her warehouse is open.
  MOORING_DOCKED = 4;
  // The station is taking her out: her warehouse is shut and her helm does nothing.
  MOORING_UNDOCKING = 5;
}

enum TransferRefusal {
  TRANSFER_REFUSAL_UNSPECIFIED = 0;
  TRANSFER_REFUSAL_NONE = 1;
  TRANSFER_REFUSAL_NOT_DOCKED = 2;
  TRANSFER_REFUSAL_BAD_AMOUNT = 3;
  TRANSFER_REFUSAL_NOT_ENOUGH_IN_HOLD = 4;
  TRANSFER_REFUSAL_NOT_ENOUGH_IN_WAREHOUSE = 5;
  TRANSFER_REFUSAL_HOLD_FULL = 6;
  TRANSFER_REFUSAL_BAD_ORDER = 7;
  // Its number was answered long ago and the answer is no longer kept. It was not done again.
  TRANSFER_REFUSAL_EXPIRED = 8;
  // Its number is ahead of the pilot's next.
  TRANSFER_REFUSAL_OUT_OF_ORDER = 9;
  // It was valid and could not be written to disk, so it was not done. Asked again under the same number and name it is tried again.
  TRANSFER_REFUSAL_NOT_SAVED = 10;
  // A sale that named a price the station is not paying.
  TRANSFER_REFUSAL_WRONG_PRICE = 11;
}

message Vec3 { double x = 1; double y = 2; double z = 3; }
message Quat { double x = 1; double y = 2; double z = 3; double w = 4; }

// A ship in flight, whole: enough to carry on flying her from.
message Flight {
  Vec3 p = 1;
  Quat level = 2;
  double yaw_rate = 3;
  double pitch_rate = 4;
  double roll_rate = 5;
  double bank = 6;
  double throttle = 7;
  double speed = 8;
}

// ── requests ──
message Empty {}
// One step's orders from the helm. `seq` counts up from 1 for each sign-in; the server flies one a step, in order.
message Orders { uint32 seq = 1; double order = 2; double rudder = 3; double elevation = 4; double roll = 5; }
message SteerRequest { repeated Orders orders = 1; }
message MineRequest { bool on = 1; }
// To ask the station for a berth (true), or to give one up or cast off from it (false). Which berth, whether she is taken
// in hand, and when she is docked are the server's to say, from where it has flown the ship.
message DockRequest { bool dock = 1; }
// Ore between the sender's own hold and the sender's own warehouse; no field names anyone else's.
// `seq` is this pilot's number for the order: 1, 2, 3 for as long as the sector lives, and the server says which is next.
// An order at or below a number already answered is never done: it is answered as it was if `op`, its own name, is still
// remembered beside that number, and refused as expired if not.
// `grams` is signed so that a client asking for less than nothing is refused by the rules and not by the wire.
message TransferRequest { string op = 1; bool withdraw = 2; sint64 grams = 3; uint32 seq = 4; }
// Ore out of the sender's own warehouse to the station, for credits. It is numbered and named as a transfer is, from the same
// count, and done once as one is. `price` is the price for a lot that the sender's glass showed: the server compares it with
// its own and refuses a sale that names another. There is no field for what the seller is to be paid.
message SellRequest { string op = 1; uint32 seq = 2; sint64 grams = 3; sint64 price = 4; }

// ── replies ──
message Rock { string id = 1; Vec3 at = 2; uint32 total = 3; uint32 remaining = 4; }
// A berth: where a ship lies in it, and the point above it where she is taken in hand and let go.
message Berth { uint32 id = 1; Vec3 at = 2; Vec3 approach = 3; Vec3 over = 4; }
// `buy_lot` grams of ore is what the station buys at a time, for `buy_price` credits.
message Station { reserved 4; string id = 1; string name = 2; Vec3 at = 3; double dock_speed = 5; double approach_range = 6; repeated Berth berths = 7; uint32 buy_lot = 8; uint32 buy_price = 9; }
message EnterReply {
  string account = 1;
  string name = 2;
  Flight flight = 3;
  uint32 cargo = 5;
  string sector = 6;
  string sector_name = 7;
  Rock rock = 8;
  double range = 9;
  uint32 rate = 10;
  uint32 capacity = 11;
  Station station = 12;
  uint32 stored = 13;
  bool docked = 14;
  // The number this pilot's next order to move ore must carry.
  uint32 next_move = 15;
  // The berth kept for her or that she lies in; 0 is none.
  uint32 berth = 16;
  Mooring mooring = 17;
  uint32 credits = 18;
}
message SteerReply { uint32 taken = 1; }
message MineReply { bool asking = 1; }
message DockReply { bool docked = 1; DockRefusal why = 2; uint32 berth = 3; Mooring mooring = 4; }
// A reply that says `ok` is a promise: the move is on the server's disk before it is sent, and before it is true anywhere else.
message TransferReply {
  string op = 1;
  bool ok = 2;
  TransferRefusal why = 3;
  bool withdraw = 4;
  uint32 grams = 5;
  uint32 cargo = 6;
  uint32 stored = 7;
  // True when this order had been answered before: this is that answer again, and nothing moved this time.
  bool repeat = 8;
  // The number this pilot's next order must carry.
  uint32 next = 9;
  uint32 seq = 10;
  // For a sale: that it was one, what it paid, and the pilot's credits after it (her credits as they stand, on any reply).
  bool sell = 11;
  uint32 paid = 12;
  uint32 credits = 13;
}

// ── events ──
message Pilot {
  string account = 1;
  string name = 2;
  Vec3 p = 3;
  Quat q = 4;
  double throttle = 5;
  bool mining = 6;
  uint32 cargo = 7;
  Vec3 v = 8;
  bool docked = 9;
  uint32 berth = 10;
  Mooring mooring = 11;
}
message StateEvent {
  uint32 tick = 1;
  uint32 remaining = 2;
  // Your own ship as the server has flown her, after the orders up to and including `ack`.
  Flight flight = 3;
  uint32 cargo = 4;
  bool mining = 5;
  Refusal why = 6;
  repeated Pilot others = 7;
  uint32 ack = 8;
  uint32 waiting = 9;
  uint32 stored = 10;
  bool docked = 11;
  uint32 next_move = 12;
  uint32 berth = 13;
  Mooring mooring = 14;
  // With a berth kept for her: what stands between her and being taken in hand, as the server sees her now.
  DockRefusal hold = 15;
  uint32 credits = 16;
  // The ore the station has bought, from anyone.
  uint32 station_ore = 17;
}
